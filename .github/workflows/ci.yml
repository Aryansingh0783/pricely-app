name: Tests

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - run: node --test test/engine.test.mjs
      - run: npm install --no-audit --no-fund
      - run: node test/ui.test.mjs
