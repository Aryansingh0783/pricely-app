<div class="app" id="app"></div>

<script>/*__APPJS__*/</script>
<script>
/* iOS Home Screen coach.
   iOS fires no install prompt, so we teach the Share gesture — but ONLY on
   iOS Safari, outside standalone, once ever.

   It is BUILT IN JS and REMOVED from the DOM on dismiss. The previous version
   shipped it in the markup with `hidden` plus an inline `display:flex`, and an
   inline display beats the UA's `[hidden]{display:none}` rule. Result: it was
   visible on every platform and the "Got it" button did nothing. Never pair
   `hidden` with an inline display. */
(function () {
  // Financial records must not be evicted. Ask the browser to keep them.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  var standalone = window.navigator.standalone === true ||
                   (typeof window.matchMedia === "function" &&
                    window.matchMedia("(display-mode: standalone)").matches);
  if (!isIOS || standalone || localStorage.getItem("nsos.coach")) return;

  setTimeout(function () {
    var el = document.createElement("div");
    el.className = "coach";
    el.innerHTML =
      '<div class="coach-text"><b>Add to Home Screen</b><br>' +
      'Tap <span class="dim">Share&nbsp;↑</span> then “Add to Home Screen” to use this like an app.</div>' +
      '<button class="coach-btn" type="button">Got it</button>';
    el.querySelector(".coach-btn").addEventListener("click", function () {
      localStorage.setItem("nsos.coach", "1");
      el.remove();
    });
    document.body.appendChild(el);
  }, 2500);
})();
</script>
